# 3Dokploy Multi-Org Docker Compose
# Despliegue 100% autónomo (estilo Beszel) con soporte para Docker Socket, login y persistencia segura
services:
  3dokploy:
    image: ghcr.io/ronnyia/3dokploy-multi:latest
    pull_policy: always
    container_name: 3dokploy-multi
    user: "0:0"
    restart: unless-stopped
    ports:
      # Puerto 3100 en el host para no chocar con el puerto 3000 de Dokploy
      - "${HOST_PORT:-3100}:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      # Persistencia de credenciales y configuración
      - ./data:/app/data
      # Escaneo automático de todos los contenedores y stacks del VPS (Modo Beszel)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    name: dokploy-network
    external: true
